# Optional Render Blueprint. Otherwise, set these manually in the Render
# dashboard under the service's Environment tab.
services:
  - type: web
    name: campuspulse-backend
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
